<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>補印結算｜考場抽題系統</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>補印結算</h1>
        <div class="subtitle">缺席者不列入補印；棄考者視為已使用題目，會列入補印。</div>
      </div>
      <div id="connectionStatus" class="status">連線中</div>
    </div>

    <div class="nav no-print">
      <a href="/input">抽題登入</a>
      <a href="/display" target="_blank">顯示抽題結果</a>
      <a href="/summary">補印結算</a>
    </div>

    <div class="card">
      <h2>今日補印清單</h2>
      <p>資料日期：<strong id="dataDate">-</strong></p>
      <p>最後更新時間：<strong id="lastUpdatedAt">-</strong></p>
      <p>抽題顯示登入密碼：<strong id="displayPassword" class="display-password-badge">-</strong><button id="showQrBtn" class="secondary">顯示 QRCode</button></p>
      <p>密碼產生時間：<strong id="displayPasswordGeneratedAt">-</strong></p>
      <p class="subtitle">密碼每天早上 4:00 自動更新，登入後可維持 12 小時。</p>
      <div class="row no-print" style="margin:16px 0; align-items:flex-end;">
        <div>
          <label for="refreshLoginAction">強制更新後的登入資訊</label>
          <select id="refreshLoginAction">
            <option value="keep">保留原本登入資訊</option>
            <option value="delete">刪除原本登入資訊</option>
          </select>
        </div>
        <button id="refreshPasswordBtn" class="secondary">強制更新密碼</button>
      </div>
      <button id="printBtn" class="print">列印補印清單</button>
      <button id="resetBtn" class="danger">結算後清除今日資料</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>題號</th>
              <th>補印份數</th>
            </tr>
          </thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
      <div id="message" class="message no-print"></div>
    </div>

    <div class="card no-print">
      <h2>各場次紀錄</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>場次</th>
              <th>崗位1</th>
              <th>崗位2</th>
              <th>崗位3</th>
            </tr>
          </thead>
          <tbody id="sessionBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="qrModal" class="qr-modal no-print" aria-hidden="true">
    <div class="qr-modal-backdrop"></div>
    <div class="qr-modal-panel" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
      <div class="qr-modal-header">
        <div>
          <div id="qrModalTitle" class="qr-modal-title">抽題顯示登入 QRCode</div>
          <div class="qr-modal-subtitle">掃描後會直接開啟登入網址並自動登入。</div>
        </div>
        <button id="closeQrBtn" class="secondary" type="button">關閉</button>
      </div>
        <div id="qrModalContent" class="qr-modal-content">
          <div class="qr-modal-loading">載入中...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script>
    var connectionStatus = document.getElementById('connectionStatus');
    var dataDate = document.getElementById('dataDate');
    var lastUpdatedAt = document.getElementById('lastUpdatedAt');
    var displayPassword = document.getElementById('displayPassword');
    var displayPasswordGeneratedAt = document.getElementById('displayPasswordGeneratedAt');
    var refreshLoginAction = document.getElementById('refreshLoginAction');
    var refreshPasswordBtn = document.getElementById('refreshPasswordBtn');
    var showQrBtn = document.getElementById('showQrBtn');
    var resetBtn = document.getElementById('resetBtn');
    var qrModal = document.getElementById('qrModal');
    var qrModalContent = document.getElementById('qrModalContent');
    var closeQrBtn = document.getElementById('closeQrBtn');
    var summaryBody = document.getElementById('summaryBody');
    var sessionBody = document.getElementById('sessionBody');
    var messageEl = document.getElementById('message');

    if (window.APP_CONFIG && window.APP_CONFIG.useLiveState) {
      if (resetBtn) resetBtn.style.display = 'none';
    }

    function setMessage(text, type) {
      if (type === undefined) type = '';
      messageEl.textContent = text;
      messageEl.className = 'message ' + type + ' no-print';
    }

    function setConnection(text, ok) {
      connectionStatus.textContent = text;
      connectionStatus.className = 'status ' + (ok ? 'ok' : 'bad');
    }

    function openQrModal() {
      if (!qrModal) return;
      qrModal.classList.add('open');
      qrModal.setAttribute('aria-hidden', 'false');
      qrModalContent.innerHTML = '<div class="qr-modal-loading">載入中...</div>';

      var password = displayPassword ? String(displayPassword.textContent || '').trim() : '';
      if (!password || password === '-') {
        qrModalContent.innerHTML = '<div class="qr-modal-error">目前沒有可用的登入密碼。</div>';
        return;
      }

      var loginUrl = window.location.origin + '/display/login/' + encodeURIComponent(password);

      apiGetText('/api/display-password-qr').then(function(svg) {
        qrModalContent.innerHTML = '' +
          '<div class="qr-modal-qr">' + svg + '</div>' +
          '<div class="qr-modal-url-label">登入網址</div>' +
          '<div class="qr-modal-url">' + loginUrl + '</div>' +
          '<div class="qr-modal-password-label">目前密碼</div>' +
          '<div class="qr-modal-password">' + password + '</div>';
      }).catch(function(error) {
        qrModalContent.innerHTML = '<div class="qr-modal-error">' + (error.message || '載入失敗。') + '</div>';
      });
    }

    function closeQrModal() {
      if (!qrModal) return;
      qrModal.classList.remove('open');
      qrModal.setAttribute('aria-hidden', 'true');
    }

    function formatRecordForSummary(record) {
      if (!record) return '-';
      var text = formatQuestion(record.questionNo);
      if (record.absent) return '<span class="absent-text">' + text + ' 缺席</span>';
      if (record.abandoned) return '<span class="abandoned-text">' + text + ' 棄考</span>';
      return text;
    }

    function renderSummary(data, summary) {
      dataDate.textContent = data.date || '-';
      lastUpdatedAt.textContent = data.lastUpdatedAt || '-';
      displayPassword.textContent = data.displayPassword || '-';
      displayPasswordGeneratedAt.textContent = data.displayPasswordGeneratedAt || '-';

      var out = '';
      for (var si = 0; si < summary.length; si++) {
        var row = summary[si];
        out += '<tr><td><strong>第 ' + row.questionNo + ' 題</strong></td><td>' + row.printCount + '</td></tr>';
      }
      summaryBody.innerHTML = out;

      var out2 = '';
      for (var s = 0; s < data.sessions.length; s++) {
        var session = data.sessions[s];
        var cells = '';
        for (var i = 1; i <= 3; i++) {
          var record = null;
          for (var ri = 0; ri < session.records.length; ri++) {
            if (Number(session.records[ri].candidateNo) === i) { record = session.records[ri]; break; }
          }
          cells += '<td>' + formatRecordForSummary(record) + '</td>';
        }
        out2 += '<tr><td><strong>第 ' + session.sessionNo + ' 場（' + session.period + '）</strong></td>' + cells + '</tr>';
      }
      sessionBody.innerHTML = out2;
    }

    document.getElementById('printBtn').addEventListener('click', function() { window.print(); });

    refreshPasswordBtn.addEventListener('click', function() {
      var invalidateExistingCookies = refreshLoginAction.value === 'delete';
      var ok = confirm(invalidateExistingCookies ? '確定要強制更新密碼，並刪除原本的登入資訊嗎？' : '確定要強制更新密碼，並保留原本的登入資訊嗎？');
      if (!ok) return;

      setMessage('密碼更新中...');
      apiRefreshDisplayPassword(invalidateExistingCookies).then(function(result) {
        renderSummary(result.data, result.summary);
        setMessage(invalidateExistingCookies ? '已強制更新密碼，並刪除原本的登入資訊。' : '已強制更新密碼，並保留原本的登入資訊。', 'ok');
      }).catch(function(error) {
        setMessage(error.message, 'error');
      });
    });

    if (showQrBtn) showQrBtn.addEventListener('click', openQrModal);
    if (closeQrBtn) closeQrBtn.addEventListener('click', closeQrModal);

    if (qrModal) {
      qrModal.addEventListener('click', function(event) {
        if (event.target === qrModal || event.target.classList.contains('qr-modal-backdrop')) closeQrModal();
      });
    }

    document.getElementById('resetBtn').addEventListener('click', function() {
      var ok = confirm('確定要清除今日所有場次資料嗎？建議先列印或確認補印清單後再清除。');
      if (!ok) return;
      apiPost('/api/reset', {}).then(function(result) {
        renderSummary(result.data, result.summary);
        setMessage('已清除今日資料。', 'ok');
      }).catch(function(error) { setMessage(error.message, 'error'); });
    });

    connectStateSocket(renderSummary, setConnection);

    apiGetState().then(function(res) { renderSummary(res.data, res.summary); }).catch(function(error) { setMessage(error.message, 'error'); });
  </script>
</body>
</html>
