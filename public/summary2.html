<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>補印結算｜考場抽題系統</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div><h1>補印結算</h1><div class="subtitle">缺考不列入補印；棄考仍列入補印。</div></div>
      <div id="connectionStatus" class="status">連線中</div>
    </div>
    <div class="nav no-print">
      <a href="/input">抽題登入</a><a href="/display" target="_blank">顯示抽題結果</a><a href="/summary">補印結算</a><a href="/history">歷史統計</a>
    </div>

    <div class="card no-print">
      <h2>MariaDB 歷史歸檔</h2>
      <p>功能：<strong id="dbEnabled">讀取中</strong>　連線：<strong id="dbConnected">讀取中</strong></p>
      <p>今日狀態：<strong id="archiveState">讀取中</strong>　最後歸檔：<strong id="lastArchivedAt">-</strong></p>
      <p class="subtitle">當日資料仍以 JSON 運作；DB 故障不影響登錄、顯示及補印。</p>
      <div class="row"><button id="archiveBtn" class="print">強制將目前抽題結果寫入 DB</button><button id="refreshArchiveStatusBtn" class="secondary">重新檢查</button></div>
      <div id="archiveMessage" class="message"></div>
    </div>

    <div class="card">
      <h2>今日補印清單</h2>
      <p>資料日期：<strong id="dataDate">-</strong>　最後更新：<strong id="lastUpdatedAt">-</strong></p>
      <p>顯示密碼：<strong id="displayPassword" class="display-password-badge">-</strong>　產生時間：<strong id="displayPasswordGeneratedAt">-</strong></p>
      <div class="row">
        <select id="refreshLoginAction"><option value="keep">保留原登入資訊</option><option value="delete">刪除原登入資訊</option></select>
        <button id="refreshPasswordBtn" class="secondary">強制更新密碼</button>
        <button id="showQrBtn" class="secondary">顯示 QRCode</button>
      </div>
      <div class="row no-print">
        <button id="printBtn" class="print">列印補印清單</button>
        <button id="resetBtn" class="danger">結算後清除今日資料</button>
      </div>
      <div class="table-wrap" style="margin-top:16px;"><table><thead><tr><th>題號</th><th>補印份數</th></tr></thead><tbody id="summaryBody"></tbody></table></div>
      <div id="message" class="message no-print"></div>
    </div>

    <div class="card no-print"><h2>各場次紀錄</h2><div class="table-wrap"><table><thead><tr><th>場次</th><th>崗位1</th><th>崗位2</th><th>崗位3</th></tr></thead><tbody id="sessionBody"></tbody></table></div></div>
  </div>

  <div id="qrModal" class="qr-modal no-print" aria-hidden="true"><div class="qr-modal-backdrop"></div><div class="qr-modal-panel"><div class="qr-modal-header"><div class="qr-modal-title">抽題顯示登入 QRCode</div><button id="closeQrBtn" class="secondary">關閉</button></div><div id="qrModalContent" class="qr-modal-content"></div></div></div>

  <script src="/config.js"></script><script src="/common.js"></script>
  <script>
    var messageEl = document.getElementById('message');
    var archiveMessage = document.getElementById('archiveMessage');
    var qrModal = document.getElementById('qrModal');
    var resetBtn = document.getElementById('resetBtn');
    if (window.APP_CONFIG && window.APP_CONFIG.useLiveState) resetBtn.style.display = 'none';

    function setMessage(el, text, type) { el.textContent = text; el.className = 'message ' + (type || ''); }
    function setConnection(text, ok) { var el = document.getElementById('connectionStatus'); el.textContent = text; el.className = 'status ' + (ok ? 'ok' : 'bad'); }
    function recordText(record) {
      if (!record) return '-';
      var text = formatQuestion(record.questionNo);
      if (record.absent) return '<span class="absent-text">' + text + ' 缺</span>';
      if (record.abandoned) return '<span class="abandoned-text">' + text + ' 棄</span>';
      return text;
    }
    function renderSummary(data, summary) {
      document.getElementById('dataDate').textContent = data.date || '-';
      document.getElementById('lastUpdatedAt').textContent = data.lastUpdatedAt || '-';
      document.getElementById('displayPassword').textContent = data.displayPassword || '-';
      document.getElementById('displayPasswordGeneratedAt').textContent = data.displayPasswordGeneratedAt || '-';
      document.getElementById('summaryBody').innerHTML = summary.map(function(row) { return '<tr><td><strong>第 ' + row.questionNo + ' 題</strong></td><td>' + row.printCount + '</td></tr>'; }).join('');
      document.getElementById('sessionBody').innerHTML = data.sessions.map(function(session) {
        var cells = [1,2,3].map(function(candidateNo) {
          var record = session.records.find(function(item) { return Number(item.candidateNo) === candidateNo; });
          return '<td>' + recordText(record) + '</td>';
        }).join('');
        return '<tr><td><strong>第 ' + session.sessionNo + ' 場（' + session.period + '）</strong></td>' + cells + '</tr>';
      }).join('');
      loadArchiveStatus();
    }
    function loadArchiveStatus() {
      apiGetText('/api/archive-status').then(function(text) {
        var status = JSON.parse(text);
        document.getElementById('dbEnabled').textContent = status.enabled ? '已啟用' : '未啟用';
        document.getElementById('dbConnected').textContent = status.connected ? '已連線' : '未連線';
        document.getElementById('archiveState').textContent = status.archived ? (status.upToDate ? '已歸檔且內容一致' : '已歸檔，但 JSON 後續有異動') : '尚未歸檔';
        document.getElementById('lastArchivedAt').textContent = status.lastArchivedAt || '-';
        if (status.error) setMessage(archiveMessage, status.error, 'error');
      }).catch(function(error) { setMessage(archiveMessage, error.message, 'error'); });
    }
    document.getElementById('archiveBtn').addEventListener('click', function() {
      if (!confirm('確定將目前 today.json 完整寫入 MariaDB 嗎？同一天資料會更新覆蓋。')) return;
      setMessage(archiveMessage, '正在歸檔...');
      apiPost('/api/archive-today', {}).then(function(result) { setMessage(archiveMessage, '歸檔成功：' + result.examDate, 'ok'); loadArchiveStatus(); }).catch(function(error) { setMessage(archiveMessage, error.message + '；JSON 仍完整保留。', 'error'); });
    });
    document.getElementById('refreshArchiveStatusBtn').addEventListener('click', loadArchiveStatus);
    document.getElementById('printBtn').addEventListener('click', function() { window.print(); });
    document.getElementById('refreshPasswordBtn').addEventListener('click', function() {
      var invalidate = document.getElementById('refreshLoginAction').value === 'delete';
      apiRefreshDisplayPassword(invalidate).then(function(result) { renderSummary(result.data, result.summary); setMessage(messageEl, '密碼已更新。', 'ok'); }).catch(function(error) { setMessage(messageEl, error.message, 'error'); });
    });
    document.getElementById('showQrBtn').addEventListener('click', function() {
      qrModal.classList.add('open'); qrModal.setAttribute('aria-hidden', 'false');
      apiGetText('/api/display-password-qr').then(function(svg) { document.getElementById('qrModalContent').innerHTML = '<div class="qr-modal-qr">' + svg + '</div><div class="qr-modal-password">' + document.getElementById('displayPassword').textContent + '</div>'; }).catch(function(error) { document.getElementById('qrModalContent').textContent = error.message; });
    });
    document.getElementById('closeQrBtn').addEventListener('click', function() { qrModal.classList.remove('open'); });
    resetBtn.addEventListener('click', function() {
      if (!confirm('確定清除今日 JSON 資料嗎？建議先完成 DB 歸檔。')) return;
      apiPost('/api/reset', {}).then(function(result) { renderSummary(result.data, result.summary); setMessage(messageEl, '已清除今日資料。', 'ok'); }).catch(function(error) { setMessage(messageEl, error.message, 'error'); });
    });
    connectStateSocket(renderSummary, setConnection);
    apiGetState().then(function(result) { renderSummary(result.data, result.summary); }).catch(function(error) { setMessage(messageEl, error.message, 'error'); });
  </script>
</body>
</html>
