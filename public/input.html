<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考場抽題推播系統</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>抽題結果登錄</h1>
        <div class="subtitle" id="questionRangeSubtitle">題號範圍由系統設定，每場次登錄 3 個崗位。</div>
      </div>
      <div id="connectionStatus" class="status">連線中</div>
    </div>

    <div class="nav">
      <a href="/input">抽題登入</a>
      <a href="/display" target="_blank">顯示抽題結果</a>
      <a href="/summary">補印結算</a>
    </div>

    <div class="card">
      <div class="row">
        <label for="sessionNo">目前登錄場次</label>
        <select id="sessionNo">
          <option value="1">第 1 場（上午）</option>
          <option value="2">第 2 場（上午）</option>
          <option value="3">第 3 場（上午）</option>
          <option value="4">第 4 場（下午）</option>
          <option value="5">第 5 場（下午）</option>
          <option value="6">第 6 場（下午）</option>
        </select>
        <button id="loadSessionBtn" class="secondary">載入場次資料</button>
      </div>
    </div>

    <div class="card">
      <h2>本場次崗位資料</h2>
      <div class="subtitle">缺席不列入補印；棄考會列入補印。缺席與棄考只能擇一，也可以都不勾選。</div>
      <div class="table-wrap" style="margin-top:16px;">
        <table>
          <thead>
            <tr>
              <th>崗位</th>
              <th>抽到題號</th>
              <th>是否缺席</th>
              <th>是否棄考</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:16px;">
        <button id="submitBtn">儲存並送出到抽題顯示結果頁面</button>
        <button id="clearBtn" class="secondary">清空本場次輸入</button>
      </div>
      <div id="message" class="message"></div>
    </div>

    <div class="card">
      <h2>目前系統狀態</h2>
      <p>目前顯示場次：<strong id="currentSessionText">-</strong></p>
      <p>最後更新時間：<strong id="lastUpdatedAt">-</strong></p>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script>
    var sessionSelect = document.getElementById('sessionNo');
    var recordsBody = document.getElementById('recordsBody');
    var messageEl = document.getElementById('message');
    var connectionStatus = document.getElementById('connectionStatus');
    var currentSessionText = document.getElementById('currentSessionText');
    var lastUpdatedAt = document.getElementById('lastUpdatedAt');
    var questionRangeSubtitle = document.getElementById('questionRangeSubtitle');

    var state = null;

    if (questionRangeSubtitle) {
      questionRangeSubtitle.textContent = '固定第 1 題至第 ' + getQuestionCount() + ' 題，每場次登錄 3 個崗位。';
    }

    function setMessage(text, type) {
      if (type === undefined) type = '';
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    function setConnection(text, ok) {
      connectionStatus.textContent = text;
      connectionStatus.className = 'status ' + (ok ? 'ok' : 'bad');
    }

    function bindExclusiveStatusChecks() {
      var absentChecks = document.querySelectorAll('.absent-check');
      var abandonedChecks = document.querySelectorAll('.abandoned-check');

      for (var ai = 0; ai < absentChecks.length; ai++) {
        absentChecks[ai].addEventListener('change', function() {
          if (!this.checked) return;
          var candidateNo = this.getAttribute('data-candidate');
          var abandonedEl = document.querySelector('.abandoned-check[data-candidate="' + candidateNo + '"]');
          if (abandonedEl) abandonedEl.checked = false;
        });
      }

      for (var bi = 0; bi < abandonedChecks.length; bi++) {
        abandonedChecks[bi].addEventListener('change', function() {
          if (!this.checked) return;
          var candidateNo = this.getAttribute('data-candidate');
          var absentEl = document.querySelector('.absent-check[data-candidate="' + candidateNo + '"]');
          if (absentEl) absentEl.checked = false;
        });
      }
    }

    function renderForm() {
      var sessionNo = Number(sessionSelect.value);
      var session = null;
      if (state && state.sessions) {
        for (var si = 0; si < state.sessions.length; si++) {
          if (Number(state.sessions[si].sessionNo) === sessionNo) { session = state.sessions[si]; break; }
        }
      }
      var records = (session && session.records) ? session.records : [
        { candidateNo: 1, questionNo: null, absent: false, abandoned: false },
        { candidateNo: 2, questionNo: null, absent: false, abandoned: false },
        { candidateNo: 3, questionNo: null, absent: false, abandoned: false }
      ];

      var out = '';
      for (var ri = 0; ri < records.length; ri++) {
        var record = records[ri];
        var absent = Boolean(record.absent);
        var abandoned = !absent && Boolean(record.abandoned);
        out += '<tr>' +
               '<td><strong>崗位 ' + record.candidateNo + '</strong></td>' +
               '<td><select class="question-select" data-candidate="' + record.candidateNo + '">' + questionOptions(record.questionNo) + '</select></td>' +
               '<td><label class="row" style="justify-content:center;">' +
               '<input type="checkbox" class="absent-check" data-candidate="' + record.candidateNo + '" ' + (absent ? 'checked' : '') + '>' +
               '缺考</label></td>' +
               '<td><label class="row" style="justify-content:center;">' +
               '<input type="checkbox" class="abandoned-check" data-candidate="' + record.candidateNo + '" ' + (abandoned ? 'checked' : '') + '>' +
               '棄考</label></td>' +
               '</tr>';
      }
      recordsBody.innerHTML = out;
      bindExclusiveStatusChecks();
    }

    function renderState(data) {
      state = data;
      currentSessionText.textContent = state.currentSession ? ('第 ' + state.currentSession + ' 場') : '-';
      lastUpdatedAt.textContent = state.lastUpdatedAt || '-';
      renderForm();
    }

    function collectRecords() {
      var records = [];
      for (var i = 1; i <= 3; i++) {
        var qEl = document.querySelector('.question-select[data-candidate="' + i + '"]');
        var absentEl = document.querySelector('.absent-check[data-candidate="' + i + '"]');
        var abandonedEl = document.querySelector('.abandoned-check[data-candidate="' + i + '"]');
        var q = qEl ? qEl.value : '';
        var absent = absentEl ? absentEl.checked : false;
        var abandoned = !absent && abandonedEl ? abandonedEl.checked : false;
        records.push({ candidateNo: i, questionNo: q === '' ? null : Number(q), absent: absent, abandoned: abandoned });
      }
      return records;
    }

    document.getElementById('loadSessionBtn').addEventListener('click', function() {
      renderForm();
      setMessage('已載入第 ' + sessionSelect.value + ' 場資料。', 'ok');
    });

    document.getElementById('submitBtn').addEventListener('click', function() {
      setMessage('送出中...');
      apiPost('/api/update-session', {
        sessionNo: Number(sessionSelect.value),
        records: collectRecords()
      }).then(function(result) {
        renderState(result.data);
        setMessage('已儲存，抽題結果顯示頁會即時更新。', 'ok');
      }).catch(function(error) {
        setMessage(error.message, 'error');
      });
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
      var selects = document.querySelectorAll('.question-select');
      for (var si = 0; si < selects.length; si++) selects[si].value = '';
      var absentChecks = document.querySelectorAll('.absent-check');
      for (var ai = 0; ai < absentChecks.length; ai++) absentChecks[ai].checked = false;
      var abandonedChecks = document.querySelectorAll('.abandoned-check');
      for (var bi = 0; bi < abandonedChecks.length; bi++) abandonedChecks[bi].checked = false;
      setMessage('已清空畫面上的本場次輸入，尚未送出。', 'ok');
    });

    sessionSelect.addEventListener('change', renderForm);

    connectStateSocket(renderState, setConnection);

    apiGetState().then(function(res) {
      sessionSelect.value = String(res.data.currentSession || 1);
      renderState(res.data);
    }).catch(function(error) { setMessage(error.message, 'error'); });
  </script>
</body>
</html>
